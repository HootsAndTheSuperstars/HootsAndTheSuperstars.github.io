<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="shortcut icon" href="assets/logo_newest.png" type="img/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Hoots! and the superstars">
    <meta property="og:description" content="Hey! this is a game! Try out Demo 3">
    <meta property="og:image" content="assets/Title Screen/hoots_titlescreen.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoots!</title>
    <style>
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        margin: 0;
        background: url(assets/Pause/pause_background.png);
        padding: 0;
    }

    #game_container {
        display: flex;
        justify-content: center;
        align-items: center;

        width: 100vw;
        height: 100vh;
        overflow: hidden;
        margin: 0;
        padding: 0;
        background: url(assets/Pause/pause_background.png);
        touch-action: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }

    /* Ajuste con margen para el canvas */
    #game_container canvas {
        display: block;
        margin: auto;
        
        /* Restamos el espacio total deseado (ej. 20px por lado = 40px en total) */
        max-width: calc(100% - 40px);
        max-height: calc(100% - 40px);
        
        object-fit: contain;
    }

    @font-face {
        font-family: 'HUDfont';
        src: url('assets/fonts/sonic-the-hedgehog-2-hud-font.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
    }
</style>
</head>
<body>

    <div id="game_container">
    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
    <script src="src/phaser/phaser.js"></script>

    
        <script type= "module" src="src/index.js"></script>
    </div>


</body>
</html>
